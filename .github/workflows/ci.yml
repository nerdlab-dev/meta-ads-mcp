name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Test
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Public content check
        run: npm run check:public
      - name: Package check
        run: npm pack --dry-run

  english-commits:
    name: English-only commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages are written in English
        run: |
          if git log --format='%s %b' "origin/${GITHUB_BASE_REF}..HEAD" \
            | grep -P '[\x{1100}-\x{11FF}\x{3130}-\x{318F}\x{AC00}-\x{D7A3}]'; then
            echo "Commit messages in this repository must be written in English."
            exit 1
          fi
